<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Constituția RM — Pregătire pentru examen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<noscript>Для работы приложения нужен JavaScript.</noscript>
<script>
/* Если скрипт упадёт — показать причину вместо пустого экрана */
window.addEventListener('error',function(e){
  var a=document.getElementById('app');
  if(a&&!a.innerHTML.trim())a.innerHTML='<pre style="padding:20px;white-space:pre-wrap;color:#8a3d35">Ошибка: '+String(e.message).replace(/</g,'&lt;')+'</pre>';
});
</script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
